spring.application.name=ecommerce-test

# Test MySQL Database Configuration
# Use environment variables from CI, fallback to defaults for local testing
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:vendora_test}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:vendora_app}
spring.datasource.password=${DB_PASSWORD:vendora_app_pass}

# JPA/Hibernate Configuration for Tests
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Use 'create' to drop and recreate schema on each test run, ensuring clean state
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging - reduced for tests
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.example.ecommerce=INFO
logging.level.org.springframework.security=WARN

# JWT Configuration for Tests
jwt.secret=test-secret-key-for-integration-tests-minimum-32-characters-required
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

# Error Handling Configuration
server.error.include-exception=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# AI Service Configuration for Tests - use mock or disabled
ai.service.url=http://localhost:8000
ai.service.timeout=5
